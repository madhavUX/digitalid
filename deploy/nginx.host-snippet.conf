# MANUAL Nginx server block for BookAnything on a Hostinger VPS that already
# serves WebGuardSphere (Nginx owns :80/:443).
#
# Do NOT replace or edit the existing webguardsphere.com server blocks.
# Add a NEW server_name for BookAnything only, then: nginx -t && systemctl reload nginx
#
# Prerequisites (BookAnything compose default / low-resource profile):
#   bookanything-web      → 127.0.0.1:18080
#   bookanything-frontend → 127.0.0.1:13000
#
# Do NOT proxy BookAnything to:
#   127.0.0.1:8000  (WebGuardSphere Laravel API)
#   127.0.0.1:6379  (host Redis)
#   127.0.0.1:3306  (WebGuardSphere MySQL)
#
# Replace book.example.com and certificate paths with real values.
# TLS may already be managed by Certbot / Hostinger — keep your existing TLS pattern.

# server {
#     listen 80;
#     server_name book.example.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 443 ssl http2;
    server_name book.example.com;

    # ssl_certificate     /etc/letsencrypt/live/book.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/book.example.com/privkey.pem;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
